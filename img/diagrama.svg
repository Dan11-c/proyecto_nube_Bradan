<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#232f3e">Proyecto 1 · Librería Tinta en AWS (us-east-1)</text>

  <!-- Internet / usuario -->
  <rect x="40" y="70" width="170" height="70" rx="10" fill="#f2f3f3" stroke="#545b64" stroke-width="2"/>
  <text x="125" y="100" font-size="15" text-anchor="middle" fill="#232f3e" font-weight="bold">Internet</text>
  <text x="125" y="122" font-size="12" text-anchor="middle" fill="#545b64">navegador / SSH (mi IP)</text>

  <!-- Region -->
  <rect x="250" y="55" width="720" height="560" rx="8" fill="none" stroke="#147eba" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="265" y="78" font-size="14" fill="#147eba" font-weight="bold">Región us-east-1</text>

  <!-- VPC -->
  <rect x="300" y="95" width="640" height="500" rx="8" fill="#f5f9ff" stroke="#8c4fff" stroke-width="2.5"/>
  <text x="318" y="120" font-size="15" fill="#8c4fff" font-weight="bold">VPC libreria-vpc · 10.0.0.0/16</text>
  <text x="318" y="140" font-size="11" fill="#545b64">DNS: resolución y nombres de host habilitados</text>

  <!-- IGW -->
  <rect x="245" y="160" width="110" height="60" rx="8" fill="#8c4fff"/>
  <text x="300" y="186" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">IGW</text>
  <text x="300" y="205" font-size="11" text-anchor="middle" fill="#fff">libreria-igw</text>
  <line x1="210" y1="120" x2="260" y2="165" stroke="#232f3e" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Route table -->
  <rect x="330" y="250" width="200" height="70" rx="8" fill="#fff" stroke="#8c4fff" stroke-width="2"/>
  <text x="430" y="274" font-size="13" text-anchor="middle" fill="#232f3e" font-weight="bold">libreria-rt-publica</text>
  <text x="430" y="292" font-size="11" text-anchor="middle" fill="#545b64">10.0.0.0/16 → local</text>
  <text x="430" y="308" font-size="11" text-anchor="middle" fill="#545b64">0.0.0.0/0 → libreria-igw</text>
  <line x1="320" y1="220" x2="380" y2="250" stroke="#8c4fff" stroke-width="2"/>

  <!-- Subnet -->
  <rect x="560" y="155" width="360" height="400" rx="8" fill="#e9f7ec" stroke="#248814" stroke-width="2.5"/>
  <text x="575" y="180" font-size="14" fill="#248814" font-weight="bold">Subred pública libreria-publica</text>
  <text x="575" y="198" font-size="11" fill="#545b64">10.0.1.0/24 · us-east-1a · IP pública automática</text>
  <line x1="530" y1="285" x2="560" y2="285" stroke="#248814" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- SG -->
  <rect x="580" y="215" width="320" height="250" rx="8" fill="none" stroke="#dd344c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="595" y="236" font-size="12" fill="#dd344c" font-weight="bold">SG libreria-web-sg</text>
  <text x="595" y="252" font-size="11" fill="#545b64">HTTP 80 ← 0.0.0.0/0 · SSH 22 ← mi IP /32</text>

  <!-- EC2 1 -->
  <rect x="600" y="270" width="135" height="170" rx="8" fill="#ed7100"/>
  <text x="667" y="296" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">EC2</text>
  <text x="667" y="316" font-size="12" text-anchor="middle" fill="#fff">libreria-web</text>
  <text x="667" y="336" font-size="11" text-anchor="middle" fill="#fff">t3.micro · AL2023</text>
  <text x="667" y="356" font-size="11" text-anchor="middle" fill="#fff">nginx</text>
  <text x="667" y="380" font-size="11" text-anchor="middle" fill="#fff">10.0.1.25</text>
  <text x="667" y="420" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">peso 80</text>

  <!-- EC2 2 -->
  <rect x="750" y="270" width="135" height="170" rx="8" fill="#ed7100" opacity="0.85"/>
  <text x="817" y="296" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">EC2</text>
  <text x="817" y="316" font-size="12" text-anchor="middle" fill="#fff">libreria-web-2</text>
  <text x="817" y="336" font-size="11" text-anchor="middle" fill="#fff">t3.micro · AL2023</text>
  <text x="817" y="356" font-size="11" text-anchor="middle" fill="#fff">nginx (versión 2)</text>
  <text x="817" y="380" font-size="11" text-anchor="middle" fill="#fff">10.0.1.149</text>
  <text x="817" y="420" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">peso 20</text>

  <!-- Route 53 (asociada a la VPC) -->
  <rect x="330" y="480" width="200" height="90" rx="8" fill="#8c4fff"/>
  <text x="430" y="503" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">Route 53</text>
  <text x="430" y="521" font-size="11" text-anchor="middle" fill="#fff">zona privada libreria.lab</text>
  <text x="430" y="538" font-size="11" text-anchor="middle" fill="#fff">web.libreria.lab · A</text>
  <text x="430" y="555" font-size="11" text-anchor="middle" fill="#fff">ponderado 80 / 20</text>
  <path d="M530,510 L667,510 L667,442" fill="none" stroke="#8c4fff" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M530,540 L817,540 L817,442" fill="none" stroke="#8c4fff" stroke-width="2" marker-end="url(#a2)"/>
  <text x="740" y="575" font-size="11" text-anchor="middle" fill="#545b64">Solo resoluble dentro de la VPC</text>

  <!-- Nivel avanzado -->
  <rect x="330" y="360" width="200" height="90" rx="8" fill="#fff" stroke="#545b64" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="430" y="384" font-size="12" text-anchor="middle" fill="#232f3e" font-weight="bold">Nivel avanzado</text>
  <text x="430" y="402" font-size="11" text-anchor="middle" fill="#545b64">desplegar.sh (AWS CLI)</text>
  <text x="430" y="418" font-size="11" text-anchor="middle" fill="#545b64">crea libreria-web-cli-sg</text>
  <text x="430" y="434" font-size="11" text-anchor="middle" fill="#545b64">+ EC2 libreria-web-cli</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c4fff"/></marker>
  </defs>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
